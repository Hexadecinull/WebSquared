name: Bug report
description: Something in WebSquared isn't working right.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please don't file security
        vulnerabilities here, see [SECURITY.md](../../docs/SECURITY.md) for how to report those privately instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 131 on Windows 11
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: WebSquared version or commit
      description: Found in Settings > About, or the commit hash if self-hosting from source.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Console errors, screenshots, or other context.
    validations:
      required: false
