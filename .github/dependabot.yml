version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 10
    ignore:
      # svelte-check only supports typescript ^5 || ^6; a major bump here
      # breaks `npm ci` outright (this happened once already). Remove this
      # once svelte-check publishes a release supporting the new major.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
